<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">

</head>
<bo>
    <header>
        <h1>Shopping car</h1>
    </header>
   <main>
        <div class="contenedor">
            <!--Añadir-->
            <div class="añadir">
                <h2>Añadir</h2>
                <form>
                    <label>Nombre del producto</label>
                    <input type="text" id="productoAñadir" name="nombreDelProducto">

                    <label>valor del producto</label>
                    <input type="number" id="valorAñadir">

                    <label>Existencias</label>
                    <input type="number" id="existenciasAñadir">

                    <label>Imagen</label>
                    <input type="text" id="imagenAñadir">

                    <input class="button" type="button" id="botonañadir" value="Añadir">
                </form> 
            </div>
            <!--Editar-->
   <div class="edita">
   <h2>Editar</h2>
   <form>
        <label>Nombre del producto</label>
        <select id="productoEditar" name="nombreDelProducto">
            <option value="">---</option>
            </select>
        <label>Atributos</label>
        <select id="atributoEditar">
            <option value="">---</option>
        </select>

        <label>Nuevo valor</label>
        <input type="text" id="nuevoAtributo">

        <input class="button" type="button" id="botonEditar" value="Editar">
        </form>
       </div>

       <!--Eliminar-->
         <div class="eliminar">
           <h2>Eliminar</h2>
           <form>
                <label>Nombre del producto</label>
                <select id="productoEliminar">
                    <option value="">---</option>
                </select>
                <input class="button" type="button" id="botonEliminar" value="Eliminar">
           </form>
         </div>
     </div>
    <!--mostrar mensaje-->
    <div class="contenedormensaje">
        <div id="mensaje"></div>
    </div>
    
    <!--mostrar productos-->
    <div class="contenedorproductos">
        <h2>Productos</h2>
        <div class="mostrarproductos" id="mostrarproductos">
        </div>    
        </div>
    </main>
    <script src="Admin.js"></script> 
</body>     
</html>
